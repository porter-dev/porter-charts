{{- $isolation := .Values.networkPolicy.isolation }}
{{- $restrictIngress := kindIs "slice" $isolation.ingress }}
{{- $restrictEgress := kindIs "slice" $isolation.egress }}
{{- if and .Values.networkPolicy.blockIMDS.enabled (not (and $isolation.enabled $restrictEgress)) }}
# Denies pod egress to the cloud provider's instance metadata endpoint
# (169.254.169.254), which otherwise lets any pod fetch the node's IAM role
# credentials. Every other egress destination is unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docker-template.fullname" . }}-block-imds
  labels:
    {{- include "docker-template.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docker-template.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
{{- end }}
{{- if $isolation.enabled }}
{{- if not (or $restrictIngress $restrictEgress) }}
{{- fail "network isolation needs ingress or egress rules" }}
{{- end }}
---
# Restricts each direction that has rules for every pod of the service,
# including its auxiliary pods, to what those rules allow. An empty list denies
# that direction entirely. Egress rules exclude the instance metadata endpoint
# themselves, so the IMDS policy above is not rendered alongside them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docker-template.fullname" . }}-isolation
  labels:
    {{- include "docker-template.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      porter.run/app-name: {{ required "podLabels must set porter.run/app-name for network isolation" (index (.Values.podLabels | default dict) "porter.run/app-name") | quote }}
      porter.run/service-name: {{ required "podLabels must set porter.run/service-name for network isolation" (index (.Values.podLabels | default dict) "porter.run/service-name") | quote }}
  policyTypes:
    {{- if $restrictIngress }}
    - Ingress
    {{- end }}
    {{- if $restrictEgress }}
    - Egress
    {{- end }}
  {{- if $restrictIngress }}
  ingress:
    {{- toYaml $isolation.ingress | nindent 4 }}
  {{- end }}
  {{- if $restrictEgress }}
  egress:
    {{- toYaml $isolation.egress | nindent 4 }}
  {{- end }}
{{- end }}
