{{- if .Values.podDisruptionBudget -}}
{{- if .Values.podDisruptionBudget.enabled  -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "docker-template.fullname" . }}
  labels:
    {{- include "docker-template.labels" . | nindent 4 }}
    {{- if .Values.labels }}
    {{- toYaml .Values.labels | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailablePercentage }}
  minAvailable: "{{ .Values.podDisruptionBudget.minAvailablePercentage }}%"
  {{- else }}
  maxUnavailable: "{{ .Values.podDisruptionBudget.maxUnavailablePercentage | default 20 }}%"
  {{- end }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "docker-template.selectorLabels" . | nindent 6 }}
{{ end }}
{{ end }}
