apiVersion: v1
kind: Service
metadata:
  name: {{ include "hosted.fullname" . }}
  labels:
    {{- include "hosted.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "hosted.selectorLabels" . | nindent 4 }}
