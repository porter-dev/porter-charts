apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "eviction-webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eviction-webhook.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "eviction-webhook.selectorLabels" . | nindent 6 }}
