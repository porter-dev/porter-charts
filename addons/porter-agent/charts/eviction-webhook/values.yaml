image:
  repository: public.ecr.aws/n9k9w4b1/eviction-webhook
  tag: c8226f3f0714466d65a81984b153a53b3c3ee386
  # digest pins the image. The tag only records which commit it was built from.
  digest: sha256:fb227c8cadf4bd5f7ea2fd98b9392c77879feb063decb1e43f7d179144b9249e
  pullPolicy: IfNotPresent

# One replica is enough: while it is down the webhook fails open and evictions
# proceed as if it were not installed. Each replica records observed downtime,
# so more than one counts every period once per replica.
replicas: 1

# maxDeferral bounds how long one pod's eviction is denied, so a replacement
# that never becomes ready cannot block a node drain forever.
maxDeferral: 10m
# mode is audit or enforce. Both log every decision and record the observed
# downtime of Porter services. Audit allows every eviction; enforce defers the
# eviction of a service's last ready pod and starts its replacement.
mode: audit
# downtimePollInterval is how often the observed downtime of Porter services
# is sampled.
downtimePollInterval: 10s

timeoutSeconds: 3

# namespaces are where the webhook protects Porter services. Porter runs
# production apps in default. The webhook can patch pods and deployments only
# in these namespaces, and each must exist before install.
namespaces:
  - default

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
