apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
  name: porter-agent-controller-manager-metrics-service
  namespace: porter-agent-system
spec:
  ports:
    - name: https
      port: 8443
      targetPort: https
  selector:
    control-plane: controller-manager
---
apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
  name: porter-agent-controller-manager
  namespace: porter-agent-system
  annotations:
    porter.managed.prometheus/scrape: 'true'
    porter.managed.prometheus/scheme: 'http'
    porter.managed.prometheus/path: '/metrics'
    porter.managed.prometheus/port: '10001'
spec:
  ports:
    - name: http
      port: 10001
      targetPort: http
  selector:
    control-plane: controller-manager
