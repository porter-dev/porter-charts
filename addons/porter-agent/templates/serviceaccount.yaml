apiVersion: v1
kind: ServiceAccount
metadata:
  name: porter-agent-controller-manager
  namespace: porter-agent-system
  {{- if and .Values.agent.serviceAccount .Values.agent.serviceAccount.annotations (gt (len .Values.agent.serviceAccount.annotations) 0) }}
  annotations:
    {{- range $key, $value := .Values.agent.serviceAccount.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
{{- if .Values.streamer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # Deliberately separate from porter-agent-controller-manager: that SA's ClusterRole
  # grants get/list/watch on secrets (needed elsewhere), which this component must never
  # have — see porter-agent-streamer-role in rbac.yaml.
  name: porter-agent-streamer
  namespace: porter-agent-system
{{- end }}

