{{- if .Values.streamer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager-streamer
  annotations:
    porter.run/agent-major-version: "v3"
    porter.run/agent-version: "{{ .Chart.Version }}"
  name: porter-agent-controller-manager-streamer
  namespace: porter-agent-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      control-plane: controller-manager-streamer
  template:
    metadata:
      labels:
        control-plane: controller-manager-streamer
      annotations:
        # Selects the promtail k8s-events job's pipeline (values.yaml / porter-agent-
        # dynamic.yaml) — same opt-in pattern as prometheus.io/scrape, but the value names
        # a registered log-processing profile rather than a bare boolean, so promtail
        # never needs to know this component's identity, and a future component with a
        # genuinely different log shape registers its own profile value/job pair instead
        # of overloading this one.
        porter.run/log-processing.profile: "k8s-event"
    spec:
      containers:
      - image: "{{ .Values.agent.image }}"
        imagePullPolicy: Always
        command: ["/porter/agent"]
        args: ["streamer"]
        envFrom:
        - configMapRef:
            name: porter-agent-config
        ports:
        - containerPort: 10001
          name: http
        name: manager
        livenessProbe:
          httpGet:
            path: /livez
            port: 10001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 10001
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: {{ .Values.streamer.resources.requests.cpu }}
            memory: {{ .Values.streamer.resources.requests.memory }}
          limits:
            cpu: {{ .Values.streamer.resources.limits.cpu }}
            memory: {{ .Values.streamer.resources.limits.memory }}
        securityContext:
          allowPrivilegeEscalation: false
      {{- if .Values.agent.privateRegistry.enabled }}
      imagePullSecrets:
        - name: "{{ .Values.agent.privateRegistry.secret }}"
      {{- end }}
      serviceAccountName: porter-agent-streamer
      terminationGracePeriodSeconds: 10
      {{- if gt (len .Values.nodeSelector) 0}}
      nodeSelector:
        {{- range $k, $v := .Values.nodeSelector }}
        {{ $k }}: {{ $v }}
        {{- end }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
{{- end }}
